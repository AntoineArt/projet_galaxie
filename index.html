<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxie - simulation procédurale 2e11 étoiles</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, Menlo, monospace; color: #cfd6e6; }
      canvas { display: block; }
      #hud { position: fixed; top: 10px; left: 10px; font-size: 12px; line-height: 1.45; pointer-events: none; text-shadow: 0 0 4px #000; white-space: pre; }
      #help { position: fixed; bottom: 10px; left: 10px; font-size: 11px; opacity: 0.7; text-shadow: 0 0 4px #000; white-space: pre; }
      #panel { position: fixed; top: 10px; right: 10px; font-size: 12px; background: rgba(8,10,16,0.75); border: 1px solid #2a3244; padding: 8px 10px; width: 260px; }
      #panel label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; gap: 8px; }
      #panel input[type=range] { width: 130px; }
      #panel .v { min-width: 60px; text-align: right; color: #9fb3d9; }
      #star { position: fixed; bottom: 10px; right: 10px; font-size: 12px; background: rgba(8,10,16,0.75); border: 1px solid #2a3244; padding: 8px 10px; width: 260px; white-space: pre; display: none; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; background: #000; }
    </style>
  </head>
  <body>
    <div id="loading">Génération de la galaxie…</div>
    <div id="hud"></div>
    <div id="help">ZQSD/WASD + souris (clic pour capturer) : vol libre   molette : vitesse   Espace/Maj : haut/bas
T : pause temps   [ ] : vitesse du temps   R : retour Soleil   G : vue galaxie   H : vue de dessus   F : viser l'étoile proche   J : sauter à son système</div>
    <div id="panel"></div>
    <div id="star"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
